<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christoph — Software Engineer</title>
<meta name="description" content="Christoph, a software engineer who builds backend systems and developer tooling.">
<meta name="theme-color" content="#17478f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<!-- Apply the saved theme before first paint to avoid a flash of the default. -->
<script src="data.js"></script>
<script>
  (function () {
    var id = null;
    try { id = localStorage.getItem('blueprint-theme'); } catch (e) {}
    var t = THEMES.find(function (x) { return x.id === id; }) || THEMES[0];
    var s = document.documentElement.style;
    s.setProperty('--bg', t.bg);
    s.setProperty('--ink', t.ink);
    if (t.bar) { s.setProperty('--bar', t.bar); document.documentElement.dataset.bar = ''; }
  })();
</script>
</head>
<body>
<div class="sheet">
  <div class="sheet-bar" aria-hidden="true"></div>

  <header class="strip">
    <a href="#/" class="brand">
      <span class="brand-mark" aria-hidden="true"><span></span></span>
      Christoph / Software Engineer
    </a>
    <span class="strip-sheet">Sheet <span id="sheet-no">01</span> of 02</span>
    <nav class="strip-nav" aria-label="Sections">
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#experience">Experience</a>
      <a href="#writing">Writing</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="view"></main>
</div>

<aside class="themes" aria-label="Theme chooser">
  <div class="themes-head">
    <span>Theme — <span id="theme-name"></span></span>
    <span class="themes-tools"><span id="theme-count"></span><button type="button" id="theme-toggle" class="themes-toggle" aria-expanded="true" aria-controls="theme-list">Hide</button></span>
  </div>
  <div class="themes-list" id="theme-list" role="radiogroup" aria-label="Color theme"></div>
</aside>

<script src="app.js"></script>
</body>
</html>
